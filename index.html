<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>2048 · 青蓝系 · 无限技能（夏洛特复活修复）</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: linear-gradient(145deg, #0a2f4a, #052030); min-height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Segoe UI', 'Quicksand', system-ui, monospace; padding: 16px; }
        .game-wrapper { background: #1a4a6e; border-radius: 48px; padding: 20px; box-shadow: 0 20px 35px rgba(0,0,0,0.5); }
        .header { display: flex; justify-content: space-between; align-items: center; background: #e0f0ff; border-radius: 40px; padding: 12px 20px; margin-bottom: 20px; gap: 12px; flex-wrap: wrap; }
        .score-box, .best-box, .popcorn-box { background: #0e5a7a; color: #f0fcff; padding: 8px 18px; border-radius: 40px; font-size: 1.2rem; font-weight: bold; font-family: monospace; }
        .grid-container { background: #6c9ebf; border-radius: 20px; padding: 12px; cursor: grab; }
        .grid-container:active { cursor: grabbing; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; background: #6c9ebf; }
        .cell { aspect-ratio: 1; background: #cce4f5; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 900; font-family: monospace; color: #1e4663; transition: transform 0.1s ease; text-shadow: 0 0 2px rgba(0,0,0,0.1); }
        .cell[data-value="2"] { background: #b8e1ff; color: #0a4a6e; }
        .cell[data-value="4"] { background: #9acdff; color: #0a4a6e; }
        .cell[data-value="8"] { background: #7bb8e6; color: #ffffff; }
        .cell[data-value="16"] { background: #5c9bd9; color: #ffffff; }
        .cell[data-value="32"] { background: #3f82cc; color: #ffffff; }
        .cell[data-value="64"] { background: #2a6cb8; color: #ffffff; }
        .cell[data-value="128"] { background: #1f5a9e; color: #ffffff; font-size: 1.6rem; }
        .cell[data-value="256"] { background: #1a88b0; color: #ffffff; font-size: 1.6rem; }
        .cell[data-value="512"] { background: #1790b8; color: #ffffff; font-size: 1.6rem; }
        .cell[data-value="1024"] { background: #0e7a9e; color: #ffffff; font-size: 1.4rem; }
        .cell[data-value="2048"] { background: #0c6c8c; color: #ffffff; font-size: 1.4rem; }
        .cell.merge-animation { transform: scale(1.2); }
        .cell.new-animation { animation: pop 0.15s ease; }
        @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 80% { transform: scale(1.2); } 100% { transform: scale(1); opacity: 1; } }
        .skills-panel { margin-top: 20px; background: #e0f0ff; border-radius: 40px; padding: 12px 16px; }
        .skills-title { font-size: 0.9rem; color: #0a4a6e; margin-bottom: 8px; text-align: center; }
        .skills-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
        .skill-card { background: #0e5a7a; border-radius: 60px; padding: 8px 16px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: 0.1s; min-width: 85px; }
        .skill-card:active { transform: scale(0.96); }
        .skill-emoji { font-size: 1.6rem; }
        .skill-name { font-size: 0.7rem; color: #e0f0ff; font-weight: bold; }
        .skill-cost { font-size: 0.7rem; background: #2a9bc0; padding: 2px 6px; border-radius: 30px; color: white; }
        .skill-limited { font-size: 0.6rem; color: #ffddbb; }
        .reset-btn { background: #2a9bc0; border: none; padding: 8px 20px; border-radius: 40px; cursor: pointer; font-weight: bold; color: white; margin-left: auto; }
        .tip { text-align: center; margin-top: 12px; color: #e0f0ff; font-size: 0.7rem; }
        @media (max-width: 550px) { .cell { font-size: 1.4rem; } .cell[data-value="128"] { font-size: 1.2rem; } .cell[data-value="256"] { font-size: 1.2rem; } .cell[data-value="512"] { font-size: 1.2rem; } .score-box, .best-box, .popcorn-box { font-size: 0.9rem; padding: 4px 12px; } .skill-card { min-width: 70px; padding: 6px 10px; } .skill-emoji { font-size: 1.2rem; } }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="header">
        <div class="score-box">🎯 得分: <span id="scoreValue">0</span></div>
        <div class="best-box">🏆 最高: <span id="bestValue">0</span></div>
        <div class="popcorn-box">🍿 焦米花: <span id="popcornValue">50</span></div>
        <button class="reset-btn" id="resetBtn">✨ 重来</button>
    </div>
    <div class="grid-container" id="gridContainer">
        <div class="grid" id="grid"></div>
    </div>
    <div class="skills-panel">
        <div class="skills-title">🔥 援助技能 · 消耗焦米花</div>
        <div class="skills-buttons" id="skillsContainer"></div>
    </div>
    <div class="tip">⬅️⬆️⬇️➡️ 滑动 / 键盘方向键 | 合并时数字会变大 | 拉狄娅&伊芙琳技能无限次 | 夏洛特技能在游戏结束时可用</div>
</div>

<script>
    (function(){
        let grid = Array(4).fill().map(() => Array(4).fill(0));
        let score = 0;
        let bestScore = localStorage.getItem('2048best') ? parseInt(localStorage.getItem('2048best')) : 0;
        let popcorn = 50;
        let gameRunning = true;
        let lastGridState = null;
        let lastScore = 0;
        let isAnimating = false;
        
        let skillRemains = { lydia: Infinity, evelyn: Infinity, corbin: 2, chastity: 1, charlotte: 1, lila: 2 };
        let nextTileIs4 = false;
        let frozenSteps = 0, frozenRow = null, frozenCol = null;
        let pendingCurseReward = false;
        
        const gridEl = document.getElementById('grid');
        const scoreSpan = document.getElementById('scoreValue');
        const bestSpan = document.getElementById('bestValue');
        const popcornSpan = document.getElementById('popcornValue');
        const resetBtn = document.getElementById('resetBtn');
        const skillsContainer = document.getElementById('skillsContainer');
        
        function updateUI() { scoreSpan.innerText = score; bestSpan.innerText = bestScore; popcornSpan.innerText = popcorn; renderGrid(); updateSkillsUI(); }
        function renderGrid() {
            gridEl.innerHTML = '';
            for(let i=0;i<4;i++) for(let j=0;j<4;j++) {
                const val = grid[i][j];
                const cell = document.createElement('div');
                cell.className = 'cell';
                if(val !== 0) { cell.setAttribute('data-value', val); cell.innerText = val; }
                else { cell.setAttribute('data-value', '0'); cell.innerText = ''; }
                gridEl.appendChild(cell);
            }
        }
        function playMergeAnimation(positions) {
            const cells = document.querySelectorAll('.cell');
            positions.forEach(([row, col]) => {
                if(row>=0 && row<4 && col>=0 && col<4 && grid[row][col] !== 0) {
                    const idx = row*4+col;
                    if(cells[idx]) { cells[idx].classList.add('merge-animation'); setTimeout(() => cells[idx].classList.remove('merge-animation'), 120); }
                }
            });
        }
        function playNewTileAnimation(pos) {
            if(!pos) return;
            const cells = document.querySelectorAll('.cell');
            const idx = pos[0]*4+pos[1];
            if(cells[idx]) { cells[idx].classList.add('new-animation'); setTimeout(() => cells[idx].classList.remove('new-animation'), 150); }
        }
        function addNewTileWithPos() {
            let empty = [];
            for(let i=0;i<4;i++) for(let j=0;j<4;j++) if(grid[i][j]===0) empty.push([i,j]);
            if(empty.length===0) return null;
            if(frozenSteps>0) {
                empty = empty.filter(([i,j]) => !(i===frozenRow || j===frozenCol));
                if(empty.length===0) empty = (()=>{ let a=[]; for(let i=0;i<4;i++)for(let j=0;j<4;j++)if(grid[i][j]===0) a.push([i,j]); return a; })();
            }
            const pos = empty[Math.floor(Math.random()*empty.length)];
            let val = nextTileIs4 ? 4 : (Math.random()<0.9?2:4);
            nextTileIs4 = false;
            grid[pos[0]][pos[1]] = val;
            return pos;
        }
        function copyGrid(g) { return g.map(row=>[...row]); }
        function isGameOver() {
            for(let i=0;i<4;i++) for(let j=0;j<4;j++) {
                if(grid[i][j]===0) return false;
                if(j<3 && grid[i][j]===grid[i][j+1]) return false;
                if(i<3 && grid[i][j]===grid[i+1][j]) return false;
            }
            return true;
        }
        function move(direction) {
            if(!gameRunning || isAnimating) return false;
            const oldGrid = copyGrid(grid);
            const oldScore = score;
            if(frozenSteps>0) { frozenSteps--; if(frozenSteps===0){ frozenRow=null; frozenCol=null; } }
            let moved=false, gainScore=0, mergePositions=[];
            if(direction==='left') {
                for(let i=0;i<4;i++) {
                    let row = grid[i].filter(v=>v!==0);
                    let newRow=[], origIndices=[];
                    for(let j=0;j<row.length;j++) origIndices.push(j);
                    let j=0;
                    while(j<row.length) {
                        if(j+1<row.length && row[j]===row[j+1]) {
                            let merged=row[j]*2;
                            newRow.push(merged); gainScore+=merged;
                            mergePositions.push([i, origIndices[j]]);
                            j+=2; moved=true;
                        } else { newRow.push(row[j]); j++; }
                    }
                    while(newRow.length<4) newRow.push(0);
                    if(JSON.stringify(grid[i])!==JSON.stringify(newRow)) moved=true;
                    grid[i]=newRow;
                }
            } else if(direction==='right') {
                for(let i=0;i<4;i++) {
                    let row = grid[i].filter(v=>v!==0).reverse();
                    let newRow=[], origIndices=[];
                    for(let j=0;j<row.length;j++) origIndices.push(3-(row.length-1-j));
                    let j=0;
                    while(j<row.length) {
                        if(j+1<row.length && row[j]===row[j+1]) {
                            let merged=row[j]*2;
                            newRow.push(merged); gainScore+=merged;
                            mergePositions.push([i, origIndices[j]]);
                            j+=2; moved=true;
                        } else { newRow.push(row[j]); j++; }
                    }
                    while(newRow.length<4) newRow.push(0);
                    newRow.reverse();
                    if(JSON.stringify(grid[i])!==JSON.stringify(newRow)) moved=true;
                    grid[i]=newRow;
                }
            } else if(direction==='up') {
                for(let j=0;j<4;j++) {
                    let col = [grid[0][j],grid[1][j],grid[2][j],grid[3][j]].filter(v=>v!==0);
                    let newCol=[], origIndices=[];
                    for(let k=0;k<col.length;k++) origIndices.push(k);
                    let k=0;
                    while(k<col.length) {
                        if(k+1<col.length && col[k]===col[k+1]) {
                            let merged=col[k]*2;
                            newCol.push(merged); gainScore+=merged;
                            mergePositions.push([origIndices[k], j]);
                            k+=2; moved=true;
                        } else { newCol.push(col[k]); k++; }
                    }
                    while(newCol.length<4) newCol.push(0);
                    for(let i=0;i<4;i++) {
                        if(grid[i][j]!==newCol[i]) moved=true;
                        grid[i][j]=newCol[i];
                    }
                }
            } else if(direction==='down') {
                for(let j=0;j<4;j++) {
                    let col = [grid[0][j],grid[1][j],grid[2][j],grid[3][j]].filter(v=>v!==0).reverse();
                    let newCol=[], origIndices=[];
                    for(let k=0;k<col.length;k++) origIndices.push(3-(col.length-1-k));
                    let k=0;
                    while(k<col.length) {
                        if(k+1<col.length && col[k]===col[k+1]) {
                            let merged=col[k]*2;
                            newCol.push(merged); gainScore+=merged;
                            mergePositions.push([origIndices[k], j]);
                            k+=2; moved=true;
                        } else { newCol.push(col[k]); k++; }
                    }
                    while(newCol.length<4) newCol.push(0);
                    newCol.reverse();
                    for(let i=0;i<4;i++) {
                        if(grid[i][j]!==newCol[i]) moved=true;
                        grid[i][j]=newCol[i];
                    }
                }
            }
            if(moved) {
                score += gainScore;
                let gainPop = Math.floor(gainScore/10);
                if(gainPop>0) popcorn += gainPop;
                if(pendingCurseReward) { popcorn+=50; pendingCurseReward=false; alert('💀 诅咒生效 +50焦米花'); }
                const newPos = addNewTileWithPos();
                updateUI();
                if(mergePositions.length>0) { isAnimating=true; playMergeAnimation(mergePositions); setTimeout(()=>isAnimating=false,150); }
                if(newPos) setTimeout(()=>playNewTileAnimation(newPos),50);
                lastGridState = copyGrid(oldGrid);
                lastScore = oldScore;
                if(score>bestScore) { bestScore=score; localStorage.setItem('2048best',bestScore); updateUI(); }
                if(isGameOver()) gameRunning=false;
                return true;
            }
            return false;
        }
        
        const skills = {
            lydia: { name:'烬火爆破', emoji:'🔥🐙', cost:30, limit:Infinity, execute:()=>{
                let pairs=[];
                for(let i=0;i<4;i++) for(let j=0;j<3;j++) if(grid[i][j]!==0 && grid[i][j]===grid[i][j+1]) pairs.push({x1:i,y1:j,x2:i,y2:j+1});
                for(let i=0;i<3;i++) for(let j=0;j<4;j++) if(grid[i][j]!==0 && grid[i][j]===grid[i+1][j]) pairs.push({x1:i,y1:j,x2:i+1,y2:j});
                if(pairs.length===0) { alert('没有可以合并的相邻数字'); return false; }
                const pair = pairs[Math.floor(Math.random()*pairs.length)];
                const newVal = grid[pair.x1][pair.y1]*2;
                score += newVal;
                grid[pair.x1][pair.y1] = newVal;
                grid[pair.x2][pair.y2] = 0;
                for(let i=0;i<4;i++) { let row = grid[i].filter(v=>v!==0); while(row.length<4) row.push(0); grid[i]=row; }
                updateUI();
                if(isGameOver()) gameRunning=false;
                playMergeAnimation([[pair.x1,pair.y1]]);
                return true;
            } },
            evelyn: { name:'光明降临', emoji:'🐰🌼', cost:20, limit:Infinity, execute:()=>{ nextTileIs4=true; alert('✨ 下次出现的新数字将是4！'); return true; } },
            corbin: { name:'命运回溯', emoji:'🐦‍⬛📘', cost:40, limit:2, execute:()=>{
                if(lastGridState) { grid=copyGrid(lastGridState); score=lastScore; gameRunning=true; updateUI(); lastGridState=null; return true; }
                else { alert('没有可回溯的上一步'); return false; }
            } },
            chastity: { name:'诅咒增殖', emoji:'🐱🌺', cost:40, limit:1, execute:()=>{ pendingCurseReward=true; alert('💀 诅咒之力！下次合并额外获得50焦米花'); return true; } },
            charlotte: { name:'不死之身', emoji:'🐰🌹', cost:100, limit:1, execute:()=>{
                if(!gameRunning && lastGridState) {
                    grid=copyGrid(lastGridState); score=lastScore; gameRunning=true; updateUI(); alert('🌹 不死之身发动！游戏继续'); return true;
                } else if(!gameRunning && !lastGridState) { alert('没有可回溯的状态'); return false; }
                else { alert('当前游戏未结束，无法使用'); return false; }
            } },
            lila: { name:'冰霜定格', emoji:'🦊❄️', cost:35, limit:2, execute:()=>{
                let maxVal=-1, maxX=-1, maxY=-1;
                for(let i=0;i<4;i++) for(let j=0;j<4;j++) if(grid[i][j]>maxVal) { maxVal=grid[i][j]; maxX=i; maxY=j; }
                if(maxVal===-1) { alert('场上无数字'); return false; }
                frozenRow=maxX; frozenCol=maxY; frozenSteps=2;
                alert(`❄️ 冻结第${maxX+1}行和第${maxY+1}列，持续2步`);
                return true;
            } }
        };
        
        function updateSkillsUI() {
            skillsContainer.innerHTML = '';
            for(const [id, skill] of Object.entries(skills)) {
                const remain = skillRemains[id];
                let disabled;
                if(id === 'charlotte') {
                    disabled = (remain === 0) || gameRunning;   // 游戏进行中禁用，结束时启用
                } else {
                    disabled = (remain === 0) || !gameRunning;
                }
                const btn = document.createElement('div');
                btn.className = 'skill-card';
                if(disabled) btn.style.opacity = '0.5';
                let limitText = (remain === Infinity) ? '无限' : `剩余 ${remain}`;
                btn.innerHTML = `<div class="skill-emoji">${skill.emoji}</div><div class="skill-name">${skill.name}</div><div class="skill-cost">🍿 ${skill.cost}</div><div class="skill-limited">${limitText}</div>`;
                if(!disabled) {
                    btn.addEventListener('click', () => {
                        if(id === 'charlotte' && gameRunning) { alert('游戏尚未结束，无法使用不死之身'); return; }
                        if(remain === 0) { alert('次数已用完'); return; }
                        if(popcorn >= skill.cost) {
                            popcorn -= skill.cost;
                            const success = skill.execute();
                            if(success) {
                                if(remain !== Infinity) skillRemains[id]--;
                                updateUI();
                            } else { popcorn += skill.cost; updateUI(); }
                        } else { alert('焦米花不足！'); }
                    });
                }
                skillsContainer.appendChild(btn);
            }
        }
        
        function resetGame() {
            grid = Array(4).fill().map(()=>Array(4).fill(0));
            score = 0; gameRunning = true; popcorn = 50;
            addNewTileWithPos(); addNewTileWithPos();
            lastGridState = null; lastScore = 0;
            skillRemains = { lydia:Infinity, evelyn:Infinity, corbin:2, chastity:1, charlotte:1, lila:2 };
            nextTileIs4 = false; frozenSteps=0; frozenRow=null; frozenCol=null; pendingCurseReward=false;
            updateUI();
        }
        
        const container = document.getElementById('gridContainer');
        let startX=0, startY=0, isDragging=false;
        function onDragStart(e) { if(!gameRunning || isAnimating) return; e.preventDefault(); isDragging=true; const c=e.clientX??(e.touches?e.touches[0].clientX:0), d=e.clientY??(e.touches?e.touches[0].clientY:0); startX=c; startY=d; }
        function onDragMove(e) { if(!isDragging || !gameRunning || isAnimating) return; e.preventDefault(); const cx=e.clientX??(e.touches?e.touches[0].clientX:0), cy=e.clientY??(e.touches?e.touches[0].clientY:0); const dx=cx-startX, dy=cy-startY; if(Math.abs(dx)<15 && Math.abs(dy)<15) return; let dir=null; if(Math.abs(dx)>Math.abs(dy)) dir=dx>0?'right':'left'; else dir=dy>0?'down':'up'; if(dir) { move(dir); isDragging=false; } }
        function onDragEnd() { isDragging=false; }
        container.addEventListener('mousedown', onDragStart); window.addEventListener('mousemove', onDragMove); window.addEventListener('mouseup', onDragEnd);
        container.addEventListener('touchstart', onDragStart); window.addEventListener('touchmove', onDragMove); window.addEventListener('touchend', onDragEnd);
        window.addEventListener('keydown', (e) => { if(!gameRunning || isAnimating) return; const key=e.key; if(key==='ArrowUp') { e.preventDefault(); move('up'); } else if(key==='ArrowDown') { e.preventDefault(); move('down'); } else if(key==='ArrowLeft') { e.preventDefault(); move('left'); } else if(key==='ArrowRight') { e.preventDefault(); move('right'); } });
        resetBtn.addEventListener('click', resetGame);
        resetGame();
    })();
</script>
</body>
</html>
